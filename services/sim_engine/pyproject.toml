[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-engine"
version = "0.1.0"
description = "Synthetic Indian payments + scam-call ecosystem with ground truth"
requires-python = ">=3.11"
dependencies = ["scam-contracts", "svckit", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["sim_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"sim_engine/calls.py" = ["E501"]  # transcript templates
