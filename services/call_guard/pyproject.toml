[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-guard"
version = "0.1.0"
description = "Digital-arrest call scoring: rules + TF-IDF/logistic classifier, per-call risk accumulation"
requires-python = ">=3.11"
dependencies = [
    "scam-contracts", "svckit", "fastapi>=0.110", "uvicorn>=0.29", "redis>=5",
    "scikit-learn>=1.4", "joblib>=1.3", "numpy>=1.26", "aiokafka>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "fakeredis[lua]>=2.20", "httpx>=0.27", "sim-engine"]
train = ["sim-engine"]

[tool.setuptools.packages.find]
include = ["call_guard*"]

[tool.setuptools.package-data]
call_guard = ["artifacts/*.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"call_guard/rules.py" = ["E501"]
"call_guard/hardneg.py" = ["E501"]
"call_guard/authored.py" = ["E501"]
"call_guard/model.py" = ["E501"]
"call_guard/train.py" = ["E501"]
"call_guard/consumer.py" = ["E501"]
"call_guard/session.py" = ["E501"]
"tests/*" = ["E501"]
