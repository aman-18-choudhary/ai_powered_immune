[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-audio"
version = "0.1.0"
description = "Consent-based microphone monitoring: chunked local Whisper transcription analysed by the call-guard scorer"
requires-python = ">=3.11"
dependencies = [
    "scam-contracts", "svckit", "call-guard", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
    "numpy>=1.26", "PyJWT>=2.8",
]

[project.optional-dependencies]
# Local speech-to-text. Models are never downloaded at runtime (local_files_only=True).
stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["live_audio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "stt: real speech-to-text tests (macOS `say` + ffmpeg + cached faster-whisper model); run with LIVE_STT_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"live_audio/detect.py" = ["E501"]
"live_audio/guidance.py" = ["E501"]
"tests/*" = ["E501"]
