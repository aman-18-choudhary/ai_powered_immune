[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-twin"
version = "0.1.0"
description = "Fraud-ring graph twin: signal-seeded ring detection over payments, takedown simulation (max-flow harm model)"
requires-python = ">=3.11"
dependencies = [
    "scam-contracts", "svckit", "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2",
    "networkx>=3.2", "numpy>=1.26", "aiokafka>=0.10",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27", "sim-engine"]

[tool.setuptools.packages.find]
include = ["graph_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: replays simulator worlds (several seconds)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
