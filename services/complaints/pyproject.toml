[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complaints"
version = "0.1.0"
description = "Citizen complaints service: Clerk-verified identity, RBAC, evidence uploads, honest text analysis"
requires-python = ">=3.11"
dependencies = [
    "svckit", "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2", "httpx>=0.27",
    "PyJWT[crypto]>=2.8", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
# call-guard is the in-process text scorer used by the first AnalysisService; without it the
# service still runs and reports analysis status UNAVAILABLE.
analysis = ["call-guard", "scikit-learn", "joblib", "numpy"]
# Transcription of uploaded audio evidence: the live-audio speech-to-text engine (faster-whisper,
# which also brings PyAV for MP3 / OGG / M4A decoding) and numpy. Imported lazily: without it the
# service runs and reports audio evidence as engine_not_configured. Opt-in like live-audio's own
# 'stt' group (CI skips it).
stt = ["live-audio[stt]", "numpy"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "cryptography>=42"]

[tool.setuptools.packages.find]
include = ["complaints*"]

[tool.setuptools.package-data]
"complaints.ml" = ["artifacts/*", "MODEL_CARD.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"complaints/ml/synth_templates.py" = ["E501"]
