[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txn-guard"
version = "0.1.0"
description = "Transaction scoring: gradient-boosted risk model + isotonic calibration, rules fallback, allow/step-up/hold decisions"
requires-python = ">=3.11"
dependencies = [
    "scam-contracts", "svckit", "fastapi>=0.110", "uvicorn>=0.29",
    "scikit-learn>=1.4", "joblib>=1.3", "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27", "sim-engine"]
train = ["sim-engine"]

[tool.setuptools.packages.find]
include = ["txn_guard*"]

[tool.setuptools.package-data]
txn_guard = ["artifacts/*.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: trains/evaluates on simulator data (tens of seconds)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"txn_guard/train.py" = ["E501"]
"txn_guard/model.py" = ["E501"]
"tests/*" = ["E501"]
