[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ledger"
version = "0.1.0"
description = "Tamper-evident hash-chained audit log with signed checkpoints and court-ready evidence packages"
requires-python = ">=3.11"
dependencies = [
    "scam-contracts", "svckit", "fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2",
    "aiokafka>=0.10", "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["evidence_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# verify.py ships to experts on Python 3.8+: no PEP 585/604 runtime syntax, keep typing.Tuple
"evidence_ledger/verify.py" = ["UP006", "UP007", "UP017", "UP036", "UP035", "UP037", "UP045"]
