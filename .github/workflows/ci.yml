name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The repo's packages depend on each other by name (scam-contracts, svckit, call-guard, ...).
      # Some of those names also exist on PyPI as unrelated projects (for example `svckit`), so
      # local packages are installed with --no-deps and only external requirements are resolved
      # from PyPI. The optional `stt` group (faster-whisper) is skipped: its tests are opt-in.
      - name: Install local packages and external dependencies
        run: |
          python -m pip install --upgrade pip
          python - > /tmp/external-requirements.txt <<'PY'
          import pathlib, re, tomllib
          skip_groups = {"stt", "dna"}  # heavy optional ML runtimes; tests use fakes
          projects = [p for p in pathlib.Path(".").rglob("pyproject.toml")
                      if ".venv" not in p.parts and "node_modules" not in p.parts]
          meta = [tomllib.loads(p.read_text())["project"] for p in projects]
          norm = lambda n: re.sub(r"[-_.]+", "-", n).lower()
          local = {norm(m["name"]) for m in meta}
          external = set()
          for m in meta:
              reqs = list(m.get("dependencies", []))
              for group, items in m.get("optional-dependencies", {}).items():
                  if group not in skip_groups:
                      reqs += items
              for r in reqs:
                  if norm(re.split(r"[\s\[<>=!~;]", r, maxsplit=1)[0]) not in local:
                      external.add(r)
          print("\n".join(sorted(external)))
          PY
          cat /tmp/external-requirements.txt
          pip install ruff pytest -r /tmp/external-requirements.txt
          for f in $(find . -name pyproject.toml -not -path "./.venv/*" -not -path "*/node_modules/*" | sort); do
            pip install --no-deps -e "$(dirname "$f")"
          done
          pip check
      - name: Lint and test every package
        run: |
          for f in $(find . -name pyproject.toml -not -path "./.venv/*" -not -path "*/node_modules/*" | sort); do
            d=$(dirname "$f")
            echo "== $d"
            (cd "$d" && ruff check . && python -m pytest -W error -q)
          done
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dockerfile and markdown link checks
        run: |
          python scripts/check_dockerfiles.py
          python scripts/check_links.py
      - name: Compose config with the example env
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env.example --profile core --profile stack --profile observability config -q
