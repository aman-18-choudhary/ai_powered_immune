[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-bench"
version = "0.1.0"
description = "Evaluation harness: metrics, lead time and an in-process benchmark over the simulator"
requires-python = ">=3.11"
dependencies = ["scam-contracts", "svckit", "sim-engine", "call-guard", "txn-guard", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["scam_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scam_bench/run_benchmark.py" = ["E501"]
