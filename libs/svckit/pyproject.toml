[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svckit"
version = "0.1.0"
description = "Shared service kit: bus, idempotency, health, PII tokenizer"
requires-python = ">=3.11"
dependencies = ["scam-contracts", "fastapi>=0.110", "pydantic>=2.5", "aiokafka>=0.10", "redis>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.20", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["svckit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
